name: Build Wan2.2 Image

# 手动触发构建, 或针对 feature/for-ci-test 分支的 PR 触发
on:
  pull_request:
    branches:
      - feature/for-ci-test
  workflow_dispatch:
    inputs:
      base_image:
        description: "构建使用的基础镜像 (BASE_IMAGE)"
        required: false
        default: ""
      image_tag:
        description: "构建产物的镜像标签 (IMAGE_TAG)"
        required: false
        default: "ppu-train-recipes:wan2.2"
      push:
        description: "是否推送镜像到 registry (需要在仓库配置 secrets)"
        required: false
        type: boolean
        default: false

# 同一分支上新的构建取消正在进行的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dockerfile.Wan2.2
    # 使用 GitHub 标准 runners
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag and build args
        id: meta
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            IMAGE_TAG="ppu-train-recipes:wan2.2"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

          # 仅当用户指定 base_image 时才传递该构建参数, 否则使用 Dockerfile 默认值
          BUILD_ARGS=""
          BASE_IMAGE="${{ github.event.inputs.base_image }}"
          if [ -n "${BASE_IMAGE}" ]; then
            BUILD_ARGS="BASE_IMAGE=${BASE_IMAGE}"
          fi
          {
            echo "build_args<<EOF"
            echo "${BUILD_ARGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # 仅在需要推送时登录 registry
      - name: Login to Docker registry
        if: ${{ github.event.inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Wan2.2 image
        uses: docker/build-push-action@v6
        with:
          # 构建上下文为仓库根目录 (Dockerfile 内 COPY 引用了 dockers/patches/...)
          context: .
          file: dockers/Dockerfile.Wan2.2
          platforms: linux/amd64
          # 不推送时将镜像加载到本地 docker, 便于验证
          load: ${{ github.event.inputs.push != 'true' }}
          push: ${{ github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.image_tag }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image info
        if: ${{ github.event.inputs.push != 'true' }}
        run: |
          docker images
          docker inspect "${{ steps.meta.outputs.image_tag }}" --format '{{.Id}} {{.Size}} bytes'
